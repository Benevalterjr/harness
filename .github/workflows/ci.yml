name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]

      - name: Static sanity checks
        run: |
          python -m py_compile src/harness/core.py src/harness/providers.py scripts/run_evaluation.py tests/test_harness_core.py
          python - <<'PY'
          import json

          with open('HARNESS.ipynb', 'r', encoding='utf-8') as f:
              nb = json.load(f)

          for cell in nb.get("cells", []):
              if cell.get("cell_type") != "code":
                  continue
              code = "".join(cell.get("source", []))
              for line in code.splitlines():
                  if line.strip().startswith("!pip install"):
                      raise AssertionError("Notebook não deve instalar dependências inline em células de código")

          print("Notebook sanity checks: OK")
          PY

      - name: Unit tests
        run: pytest -q

      - name: Benchmark smoke test
        run: python scripts/run_evaluation.py
