[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harness"
version = "0.1.0"
description = "LLM evaluation harness with retrieval, quantization, and benchmark metrics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "tiktoken>=0.7",
  "google-generativeai>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
providers = [
  "openai>=1.0.0",
  "anthropic>=0.30.0",
  "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/<OWNER>/<REPO>"
Issues = "https://github.com/<OWNER>/<REPO>/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
